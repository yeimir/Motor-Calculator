<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5fff">
<title>Calculadora de protecciones de motores</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14181f;--mu:#5b6574;--bd:#dde2ea;--ac:#0b5fff;--ac2:#e8f0ff;--ok:#0a7a45;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1319;--card:#181e27;--tx:#e8ecf2;--mu:#98a3b3;--bd:#2a3340;--ac:#5b93ff;--ac2:#1b2740;--ok:#4cd694}}
:root[data-theme="dark"]{--bg:#0f1319;--card:#181e27;--tx:#e8ecf2;--mu:#98a3b3;--bd:#2a3340;--ac:#5b93ff;--ac2:#1b2740;--ok:#4cd694}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
label:first-child{margin-top:0}
input,select{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{font:inherit;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.big{display:flex;justify-content:space-between;align-items:baseline;background:var(--ac2);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.big b{font-size:28px;color:var(--ac)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd)}
.kv:last-child{border:0}
.kv span:first-child{color:var(--mu);font-size:14px}
.kv span:last-child{text-align:right;font-weight:600}
.kv small{display:block;font-weight:400;color:var(--mu);font-size:12px}
h2{font-size:14px;margin:0 0 6px;color:var(--ac)}
.note{font-size:12px;color:var(--mu);line-height:1.5}
.err{color:#d33;font-weight:600}
.ref{display:block;font-style:normal;font-size:11px;color:var(--ac);font-weight:400;margin-top:1px}
.kv small{max-width:260px;margin-left:auto}
</style>
</head>
<body>
<div class="w">
<h1>Protecciones de motores</h1>
<p class="sub">Basado en NEC 430 (equivalente al COVENIN 200). Cobre 75 °C.</p>

<div class="card">
<label>Alimentación</label>
<div class="seg"><button id="p1">Monofásico</button><button id="p3" class="on">Trifásico</button></div>
<div class="row">
<div><label>Potencia</label><input id="pw" type="number" inputmode="decimal" value="10" min="0" step="any"></div>
<div><label>Unidad</label><select id="un"><option value="hp">HP</option><option value="kw">kW</option></select></div>
</div>
<div class="row">
<div><label>Tensión (V)</label><select id="v"></select></div>
<div><label>Factor de servicio</label><select id="sf"><option value="1.15">≥ 1.15</option><option value="1.0">1.0</option></select></div>
</div>
<label>Corriente de placa (A) — opcional</label>
<input id="np" type="number" inputmode="decimal" placeholder="Para ajustar el relé térmico" step="any">
<div class="row">
<div><label>Longitud (m)</label><input id="ln" type="number" inputmode="decimal" placeholder="Un sentido" step="any"></div>
<div><label>Caída máx. (%)</label><input id="vd" type="number" inputmode="decimal" value="3" step="any"></div>
</div>
<div class="row">
<div><label>Temp. ambiente (°C)</label><input id="ta" type="number" inputmode="decimal" value="30"></div>
<div><label>Conductores en tubería</label><input id="ng" type="number" inputmode="numeric" value="3" min="1"></div>
</div>
</div>

<div id="out"></div>
<p class="note">Valores de referencia para predimensionar. Verifica siempre con la placa del motor, el fabricante, la temperatura, el número de conductores agrupados, la caída de tensión y la normativa local vigente.</p>
</div>

<script>
var HP1=[1/6,1/4,1/3,.5,.75,1,1.5,2,3,5,7.5,10];
var C1=[115,200,208,230];
var T1={"0.1667":[4.4,2.5,2.4,2.2],"0.25":[5.8,3.3,3.2,2.9],"0.3333":[7.2,4.1,4,3.6],"0.5":[9.8,5.6,5.4,4.9],"0.75":[13.8,7.9,7.6,6.9],"1":[16,9.2,8.8,8],"1.5":[20,11.5,11,10],"2":[24,13.8,13.2,12],"3":[34,19.6,18.7,17],"5":[56,32.2,30.8,28],"7.5":[80,46,44,40],"10":[100,57.5,55,50]};
var C3=[200,208,230,460,575];
var T3={"0.5":[2.5,2.4,2.2,1.1,.9],"0.75":[3.7,3.5,3.2,1.6,1.3],"1":[4.8,4.6,4.2,2.1,1.7],"1.5":[6.9,6.6,6,3,2.4],"2":[7.8,7.5,6.8,3.4,2.7],"3":[11,10.6,9.6,4.8,3.9],"5":[17.5,16.7,15.2,7.6,6.1],"7.5":[25.3,24.2,22,11,9],"10":[32.2,30.8,28,14,11],"15":[48.3,46.2,42,21,17],"20":[62.1,59.4,54,27,22],"25":[78.2,74.8,68,34,27],"30":[92,88,80,40,32],"40":[120,114,104,52,41],"50":[150,143,130,65,52],"60":[177,169,154,77,62],"75":[221,211,192,96,77],"100":[285,273,248,124,99],"125":[359,343,312,156,125],"150":[414,396,360,180,144],"200":[552,528,480,240,192]};
var HP3=Object.keys(T3).map(Number);
var V1=[120,208,220,240], V3=[208,220,230,380,400,440,460,480,575,600];
var CAB=[["14",2.08,20],["12",3.31,25],["10",5.26,35],["8",8.37,50],["6",13.3,65],["4",21.2,85],["3",26.7,100],["2",33.6,115],["1",42.4,130],["1/0",53.5,150],["2/0",67.4,175],["3/0",85,200],["4/0",107,230],["250 kcmil",127,255],["300 kcmil",152,285],["350 kcmil",177,310],["400 kcmil",203,335],["500 kcmil",253,380],["600 kcmil",304,420]];
var BRK=[15,20,25,30,35,40,45,50,60,70,80,90,100,110,125,150,175,200,225,250,300,350,400,450,500,600,700,800,1000,1200,1600,2000];
var CON=[9,12,18,25,32,40,50,65,80,95,115,150,185,225,265,330,400,500,630];
var ph=3;
var $=function(i){return document.getElementById(i)};

function fillV(){
  var l=ph==1?V1:V3, d=ph==1?240:460, s="";
  l.forEach(function(x){s+='<option value="'+x+'"'+(x==d?" selected":"")+'>'+x+' V</option>'});
  $("v").innerHTML=s;
}
function up(arr,x){for(var i=0;i<arr.length;i++){if(arr[i]>=x-1e-9)return arr[i]}return null}
function r(x,d){return (Math.round(x*Math.pow(10,d||1))/Math.pow(10,d||1)).toString()}
function fmtHP(h){
  if(Math.abs(h-1/6)<.01)return"1/6";if(Math.abs(h-.25)<.01)return"1/4";if(Math.abs(h-1/3)<.01)return"1/3";
  if(h==.5)return"1/2";if(h==.75)return"3/4";return String(h);
}
function flc(hp,V){
  var T=ph==1?T1:T3, C=ph==1?C1:C3, key=ph==1&&hp<1&&Math.abs(hp-1/6)<.01?"0.1667":(Math.abs(hp-1/3)<.01?"0.3333":String(hp));
  var row=T[key], col, scale=1;
  if(ph==1){ if(V<=127)col=0; else if(V<=208)col=2; else col=3; }
  else{
    if(V<=208)col=V<=200?0:1; else if(V<=240)col=2;
    else if(V<=380||V<=400){col=3;scale=460/V}
    else if(V<=480)col=3; else col=4;
  }
  var base=row[col];
  if(ph==1&&V==120)base=row[0];
  return {i:base*scale, col:C[col], scaled:scale!=1};
}
var RK=[10.2,6.4,4.0,2.5,1.6,1.0,.79,.62,.49,.39,.31,.25,.20,.17,.14,.12,.105,.084,.07];
var NEMA=[["00",1.5,1.5,2],["0",3,3,5],["1",7.5,7.5,10],["2",10,15,25],["3",25,30,50],["4",40,50,100],["5",75,100,200],["6",150,200,400]];
var EGC=[[15,"14"],[20,"12"],[60,"10"],[100,"8"],[200,"6"],[300,"4"],[400,"3"],[500,"2"],[600,"1"],[800,"1/0"],[1000,"2/0"],[1200,"3/0"],[1600,"4/0"],[2000,"250 kcmil"]];
function tf(t){return t<=20?1.08:t<=25?1.05:t<=30?1:t<=35?.94:t<=40?.88:t<=45?.82:t<=50?.75:t<=55?.67:t<=60?.58:t<=65?.47:.33}
function gf(n){return n<=3?1:n<=6?.8:n<=9?.7:n<=20?.5:n<=30?.45:n<=40?.4:.35}
function nema(hp,V){
  if(ph==1)return null;
  var c=V<=208?1:(V<=240?2:3);
  for(var i=0;i<NEMA.length;i++){if(NEMA[i][c]>=hp)return NEMA[i][0]}
  return "> 6";
}
function calc(){
  var P=parseFloat($("pw").value),V=parseFloat($("v").value),sf=parseFloat($("sf").value),np=parseFloat($("np").value);
  var Ta=parseFloat($("ta").value),N=parseInt($("ng").value),L=parseFloat($("ln").value),vm=parseFloat($("vd").value);
  var o=$("out");
  if(!(P>0)){o.innerHTML="";return}
  if(isNaN(Ta))Ta=30; if(!(N>0))N=ph==1?2:3; if(isNaN(L))L=0; if(!(vm>0))vm=3;
  var hpIn=$("un").value=="kw"?P/0.746:P;
  var hp=up(ph==1?HP1:HP3,hpIn*0.98);
  if(hp==null){o.innerHTML='<div class="card"><span class="err">Potencia fuera de tabla.</span> Máximo '+(ph==1?"10 HP (monofásico)":"200 HP (trifásico)")+'. Usa la corriente de placa del motor.</div>';return}
  var f=flc(hp,V),I=f.i,kw=hp*0.746;
  var amp=I*1.25,ft=tf(Ta),fg=gf(N),need=amp/(ft*fg);
  var iA=-1;for(var k=0;k<CAB.length;k++){if(CAB[k][2]>=need){iA=k;break}}
  var k2=ph==3?1.732:2;
  function vdp(j){return k2*I*RK[j]*L/1000/V*100}
  var iF=iA;
  if(iA>=0&&L>0){while(iF<CAB.length-1&&vdp(iF)>vm)iF++}
  var cA=iA>=0?CAB[iA]:null,cF=iF>=0?CAB[iF]:null;
  var iol=isNaN(np)?I:np,olm=sf>=1.15?1.25:1.15,ol=iol*olm;
  var bk=I*2.5,bkS=up(BRK,bk),fu=I*1.75,fuS=up(BRK,fu),inst=I*8;
  var disc=I*1.15,discS=up(BRK,disc),con=up(CON,I),ns=nema(hp,V);
  var eg=null;for(var e=0;e<EGC.length;e++){if(EGC[e][0]>=bkS){eg=EGC[e][1];break}}
  function kv(a,b,s,rf){return '<div class="kv"><span>'+a+'</span><span>'+b+((s||rf)?'<small>'+(s||"")+(rf?'<em class="ref">'+rf+'</em>':'')+'</small>':'')+'</span></div>'}
  var h='<div class="big"><span>Corriente a plena carga (FLC)</span><b>'+r(I,1)+' A</b></div>';
  h+='<div class="card"><h2>Motor</h2>';
  h+=kv("Tamaño estándar usado",fmtHP(hp)+' HP / '+r(kw,2)+' kW',Math.abs(hpIn-hp)>.02?"Se redondeó al tamaño estándar":"");
  h+=kv("Corriente de tabla",r(I,1)+' A',f.scaled?"Escalado desde la columna "+f.col+" V (aprox.)":"Columna "+f.col+" V",'NEC '+(ph==1?"Tabla 430.248":"Tabla 430.250")+' · 430.6(A)(1)');
  h+='</div><div class="card"><h2>Conductor de alimentación</h2>';
  h+=kv("Ampacidad mínima (125 % FLC)",r(amp,1)+' A',"","NEC 430.22");
  h+=kv("Factor de temperatura ("+Ta+" °C)",ft,"","NEC Tabla 310.15(B)(1), columna 75 °C");
  h+=kv("Factor de agrupamiento ("+N+" cond.)",fg,"","NEC 310.15(C)(1)");
  h+=kv("Ampacidad tabulada requerida",r(need,1)+' A',"125 % FLC ÷ (temp × agrup.)","NEC Tabla 310.16, 110.14(C)");
  h+=kv("Calibre por ampacidad",cA?cA[0]+' AWG/kcmil':"> 600 kcmil, usar paralelos",cA?"≈ "+cA[1]+' mm² · '+cA[2]+' A':"","NEC Tabla 310.16 (Cu 75 °C)");
  if(L>0&&cA){
    h+=kv("Calibre por caída de tensión ("+vm+" % máx.)",cF[0]+' AWG/kcmil',"Caída ≈ "+r(vdp(iF),2)+' % ('+r(vdp(iF)*V/100,1)+' V) a '+L+' m',"NEC 210.19(A) Nota inf. 4 · 215.2(A)(2)");
    h+=kv("Calibre final",'<span style="color:var(--ok)">'+cF[0]+' AWG/kcmil</span>',"≈ "+cF[1]+' mm² · se toma el mayor de ambos criterios');
  }
  h+=kv("Tierra (Cu)",eg?eg+' AWG/kcmil':"—","Según el breaker de "+bkS+" A","NEC Tabla 250.122");
  h+='</div><div class="card"><h2>Protección contra sobrecarga</h2>';
  h+=kv("Ajuste máx. relé térmico ("+(olm*100)+" %)",r(ol,1)+' A',isNaN(np)?"Con FLC de tabla; usa la corriente de placa si la tienes":"Con la corriente de placa","NEC 430.32(A)(1) · 430.6(A)(2)");
  h+=kv("Rango sugerido del relé","≈ "+r(iol*0.9,1)+' – '+r(ol,1)+' A',"","NEC 430.32(C) si no basta, hasta 130 % / 140 %");
  h+='</div><div class="card"><h2>Cortocircuito y falla a tierra</h2>';
  h+=kv("Breaker termomagnético (máx. 250 %)",r(bk,1)+' A → '+bkS+' A',"Siguiente valor estándar permitido","NEC Tabla 430.52 · 430.52(C)(1) Exc. 1 · 240.6(A)");
  h+=kv("Fusible retardado (máx. 175 %)",r(fu,1)+' A → '+fuS+' A',"","NEC Tabla 430.52");
  h+=kv("Breaker magnético solo (máx. 800 %)",r(inst,0)+' A',"Hasta 1100 % en motores diseño E; solo con protección de sobrecarga","NEC 430.52(C)(3) · 430.52(C)(3) Exc. 1");
  h+='</div><div class="card"><h2>Maniobra y desconexión</h2>';
  h+=kv("Contactor AC-3 mínimo",con?con+' A':"> 630 A","Debe ser ≥ FLC","IEC 60947-4-1 · NEC 430.83(A)");
  h+=kv("Contactor NEMA",ns?"Tamaño "+ns:"No aplica en monofásico","Por HP según tensión (200 / 230 / 460–575 V)","NEMA ICS 2 · NEC 430.83(A)(1)");
  h+=kv("Seccionador (115 % FLC)",discS+' A',"Mínimo "+r(disc,1)+' A',"NEC 430.110(A) · 430.109");
  h+='</div>';
  o.innerHTML=h;
}
function setPh(n){
  ph=n;$("p1").className=n==1?"on":"";$("p3").className=n==3?"on":"";
  $("ng").value=n==1?2:3;fillV();calc();
}
$("p1").onclick=function(){setPh(1)};
$("p3").onclick=function(){setPh(3)};
["pw","un","v","sf","np","ta","ng","ln","vd"].forEach(function(i){$(i).addEventListener("input",calc)});
fillV();calc();
</script>
</body>
</html>
